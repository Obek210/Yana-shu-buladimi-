name: Build T.O.I.B.O.T Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate full T.O.I.B.O.T project and download offline STT model
        run: python3 toibot_apk_tayyor.py

      - name: Build APK with Gradle and show exact compiler errors if any
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build_output.log || {
            echo "=== EXACT KOTLIN / GRADLE ERRORS ==="
            grep -n "e: " build_output.log || true
            exit 1
          }

      - name: Upload TOIBOT APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOIBOT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
